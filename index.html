-radius:18px;padding:20px;width:min(600px,100%);max-height:90vh;overflow:auto}.mh{display:flex;justify-content:space-between;align-items:center}.mh h3{margin:0}.close{border:0;background:#eef2f6;border-radius:8px;width:34px;height:34px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #d6dde7;border-radius:9px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.mobile{display:none}

</style></head><body><div class="app"><aside class="side"><div class="logo">Order <b>Pintar</b></div><div id="nav" class="nav"></div></aside><main class="main"><header><div><h1 id="title">Dashboard</h1><div class="muted">V6 — fondasi stabil untuk trial</div></div><button id="add" class="btn primary" style="display:none">＋ Tambah</button></header><div id="view"></div></main></div><div id="mobile" class="mobile"></div><div id="modal" class="modal"><div class="box"><div class="mh"><h3 id="mt">Form</h3><button class="close" onclick="closeM()">×</button></div><div id="mb"></div><div class="foot"><button class="btn soft" onclick="closeM()">Batal</button><button id="save" class="btn primary">Simpan</button></div></div></div>

const K='OPV6';let d=JSON.parse(localStorage.getItem(K)||'null')||{items:[{id:'i1',name:'Amoxicillin 500 mg',unit:'tablet',real:10,sys:10,rop:50},{id:'i2',name:'Paracetamol 500 mg',unit:'tablet',real:35,sys:35,rop:100},{id:'i3',name:'Promag',unit:'tablet',real:20,sys:20,rop:60}],pbf:[{id:'p1',name:'PBF A',term:30,tol:0,profile:'Ketat'},{id:'p2',name:'PBF B',term:45,tol:7,profile:'Normal'},{id:'p3',name:'PBF C',term:60,tol:14,profile:'Longgar'}],offers:[{id:'o1',item:'i1',pbf:'p1',name:'Amoxicillin 500mg Cap',buy:'box',conv:100,price:210000,stock:1000},{id:'o2',item:'i1',pbf:'p2',name:'Amox 500 Cap',buy:'box',conv:100,price:195000,stock:20},{id:'o3',item:'i2',pbf:'p2',name:'Paracetamol 500mg',buy:'box',conv:100,price:80000,stock:1000},{id:'o4',item:'i3',pbf:'p1',name:'Promag Tab',buy:'pack',conv:12,price:36000,stock:100},{id:'o5',item:'i3',pbf:'p2',name:'Promag',buy:'pack',conv:3,price:10000,stock:100}]};
const menus=[['dash','Dashboard'],['items','Master Barang'],['pbf','Master PBF'],['offers','Produk PBF'],['import','Import PBF'],['stock','Stok & ROP'],['order','Order Pintar']];let page='dash',edit=null,type=null;const $=x=>document.getElementById(x),saveDB=()=>localStorage.setItem(K,JSON.stringify(d));const money=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');const I=id=>d.items.find(x=>x.id==id),P=id=>d.pbf.find(x=>x.id==id);
function imports(){
$('view').innerHTML=`<div class="card" style="background:#2563eb;color:#fff;margin-bottom:16px"><h2 style="margin:0 0 5px">Import Price List PBF</h2><div style="color:#dbeafe">Upload Excel/CSV. Data ditinjau dahulu sebelum disimpan; harga bersih tidak akan diberi diskon dua kali.</div></div>
<div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><b>1. Pilih PBF</b><select id="impPbf" style="width:100%;padding:11px;margin-top:10px;border:1px solid #d8dee8;border-radius:10px">${d.pbf.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><br><br><b>2. Pilih file</b><input id="impFile" type="file" accept=".xlsx,.xls,.csv" style="width:100%;padding:12px;margin-top:10px;border:1px dashed #94a3b8;border-radius:10px"><p class="muted" style="font-size:12px">Kolom boleh berbeda-beda: Nama Barang/Produk, HNA/HPP/Harga, Satuan, Stok/Qty, Disc.</p><button class="btn primary" style="width:100%" onclick="previewImport()">Preview & Validasi</button></div><div class="card"><b>Yang dilakukan sistem</b><p class="muted">1. Membaca file<br>2. Mencari nama barang yang mirip<br>3. Menghitung harga setelah diskon bila tersedia<br>4. Menyimpan nama barang sesuai PBF<br>5. Mengisi stok PBF dan konversi<br><br><b>Jika barang belum dikenali</b><br>Barang dibuat sebagai Master Barang baru supaya data tidak hilang.</p></div></div><div id="impResult" style="margin-top:16px"></div>`}
function N(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\b(tab|tablet|kapsul|caps|cap|box|dus|strip|blister|botol|pcs|pack)\b/g,' ').replace(/\s+/g,' ').trim()}
function col(h,ks){let a=h.map(x=>N(x));return h.find((x,i)=>ks.some(k=>a[i].includes(N(k))))||null}
function num(v){if(typeof v==='number')return v;let s=String(v??'').replace(/[^0-9,.-]/g,'');if(!s)return 0;if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');else s=s.replace(/\./g,'').replace(',','.');return Number(s)||0}
function sim(a,b){a=N(a);b=N(b);if(a===b)return 1;let A=new Set(a.split(' ')),B=new Set(b.split(' '));return [...A].filter(x=>B.has(x)).length/Math.max(A.size,B.size)}
function matchItem(name){let best=null,sc=0;for(let x of d.items){let q=sim(name,x.name);if(q>sc){sc=q;best=x}}return sc>=.55?best:null}
let importDraft=null;
function headerKey(s){return String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function findCol(headers, aliases){let scored=headers.map(h=>{let k=headerKey(h);let score=0;for(const a of aliases){let ak=headerKey(a);if(k===ak)score=Math.max(score,100);else if(k.includes(ak))score=Math.max(score,60+ak.length/10)}return {h,score}}).sort((a,b)=>b.score-a.score);return scored[0]?.score>=60?scored[0].h:null}
function readNum(v){if(typeof v==='number')return Number.isFinite(v)?v:0;let s=String(v??'').trim().replace(/\s/g,'').replace(/[^0-9,.-]/g,'');if(!s)return 0;if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}else if(s.includes(',')){s=s.replace(',','.')}else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');const n=Number(s);return Number.isFinite(n)?n:0}
function chooseHeader(rows){let best={idx:-1,score:0,headers:[]};for(let i=0;i<Math.min(rows.length,40);i++){let h=(rows[i]||[]).map(v=>String(v??'').trim());let text=h.map(headerKey);let score=0;if(text.some(x=>/nama barang|nama produk|produk|description|item/.test(x)))score+=2;if(text.filter(x=>/hna|hpp|harga|netto|price/.test(x)).length>=2)score+=3;else if(text.some(x=>/hna|hpp|harga|netto|price/.test(x)))score+=2;if(text.some(x=>/satuan|unit|kemasan|kms/.test(x)))score++;if(text.some(x=>/disc|diskon|discount/.test(x)))score++;if(score>best.score)best={idx:i,score,headers:h}}return best.score>=3?best:null}
async function previewImport(){let f=$('impFile').files[0],pf=$('impPbf').value;if(!f)return alert('Pilih file Excel/CSV terlebih dahulu.');if(typeof XLSX==='undefined')return alert('Pembaca Excel belum termuat. Pastikan internet aktif.');try{let wb=XLSX.read(await f.arrayBuffer(),{type:'array'});let selected=null,rows=null,header=null,sheetName='';for(const sn of wb.SheetNames){const arr=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:true});const h=chooseHeader(arr);if(h&&(!selected||h.score>selected.score)){selected=h;rows=arr;sheetName=sn}}if(!selected)throw new Error('Header kolom tidak ditemukan. Periksa apakah file memiliki kolom nama produk dan harga.');header=selected.headers;let nameC=findCol(header,['nama barang','nama produk','nama obat','produk','description','item','nama']);const priceHeader=/hna|hpp|harga|netto|price|disc|diskon|discount/i; if(!nameC){const first=header.find(h=>h&&!priceHeader.test(String(h))&&!/^(satuan|unit|kemasan|kms|stok|stock|qty)$/i.test(String(h)));nameC=first||null}let unitC=findCol(header,['satuan','unit','kemasan','satuan beli','kms']);if(!unitC&&header.length>=3)unitC=header[2];const stockC=findCol(header,['stok pbf','stok','stock','qty ready','quantity','available']);const convC=findCol(header,['isi per kemasan','konversi','jumlah isi','content','isi']);const hppC=findCol(header,['hpp','harga netto','harga bersih','harga jadi','harga net','net price','harga beli']);const hnaC=findCol(header,['hna ppn','hna+ppn','hna','harga normal','list price']);const final2C=findCol(header,['harga 2','harga2','netto 2']);const final1C=findCol(header,['harga 1','harga1']);const disc1C=findCol(header,['disc 1','diskon 1','discount 1']);const disc2C=findCol(header,['disc 2','diskon 2','discount 2']);if(!nameC)throw new Error('Kolom nama produk tidak dikenali. Import dibatalkan agar data tidak salah.');if(!hppC&&!hnaC&&!final1C&&!final2C)throw new Error('Kolom harga tidak dikenali. Import dibatalkan agar harga tidak ditebak.');let parsed=[],skipped=0,invalid=0;for(let ri=selected.idx+1;ri<rows.length;ri++){let r=rows[ri]||[];let obj={};header.forEach((h,i)=>{if(h)obj[h]=r[i]??''});let name=String(obj[nameC]??'').trim();if(!name){skipped++;continue}let rawPrice=0,priceMode='';if(final2C&&readNum(obj[final2C])>0){rawPrice=readNum(obj[final2C]);priceMode='Harga 2 (dianggap harga final; diskon tidak diterapkan ulang)'}else if(final1C&&readNum(obj[final1C])>0){rawPrice=readNum(obj[final1C]);priceMode='Harga 1 (dianggap harga final; diskon tidak diterapkan ulang)'}else if(hppC&&readNum(obj[hppC])>0){rawPrice=readNum(obj[hppC]);priceMode='HPP/netto (diskon tidak diterapkan ulang)'}else if(hnaC&&readNum(obj[hnaC])>0){rawPrice=readNum(obj[hnaC]);let d1=readNum(obj[disc1C]),d2=readNum(obj[disc2C]);if(d1<0||d1>100||d2<0||d2>100){invalid++;continue}if(d1)rawPrice*=1-d1/100;if(d2)rawPrice*=1-d2/100;priceMode='HNA dikurangi diskon yang terdeteksi'}else{invalid++;continue}if(!(rawPrice>0)){invalid++;continue}let unit=String(obj[unitC]??'unit').trim()||'unit';let conv=convC?readNum(obj[convC]):1;if(!(conv>0))conv=1;let stock=stockC?readNum(obj[stockC]):0;let candidate=matchItem(name);let confidence=candidate?sim(name,candidate.name):0;let manufacturer=String(obj[findCol(header,['produsen','manufacturer','principal'])]??'').trim();if(manufacturer&&headerKey(manufacturer)!==headerKey(name))name=name+' — '+manufacturer;parsed.push({row:ri+1,name,unit,conv,price:rawPrice,stock,matchId:candidate&&confidence>=.82?candidate.id:null,candidate:candidate&&confidence>=.55?candidate.name:'',confidence,priceMode})}const duplicate=(d.importHistory||[]).some(h=>h.file===f.name&&h.pbf===pf);importDraft={file:f.name,pbf:pf,sheet:sheetName,rows:parsed,skipped,invalid,duplicate,createdAt:new Date().toISOString()};const show=parsed.slice(0,12).map(x=>`<tr><td>${x.row}</td><td>${x.name}</td><td>${x.unit}</td><td>${money(x.price)}</td><td>${x.conv}</td><td>${x.stock}</td><td>${x.matchId?'Cocok: '+(I(x.matchId)?.name||'Master'):(x.candidate?'Perlu cek: '+x.candidate:'Master baru')}</td></tr>`).join('');$('impResult').innerHTML=`<div class="card"><h3 style="margin-top:0">Preview impor — belum disimpan</h3><p class="muted">File: <b>${f.name}</b> · Sheet: <b>${sheetName}</b> · Baris valid: <b>${parsed.length}</b> · Dilewati: <b>${skipped}</b> · Harga/angka tidak valid: <b>${invalid}</b></p>${importDraft.duplicate?'<div class="notice" style="background:#fff7ed;color:#9a3412"><b>Peringatan:</b> nama file dan PBF ini pernah diimpor. Periksa histori sebelum menyimpan ulang.</div>':''}<p class="muted">Harga yang dipilih menggunakan prioritas Harga 2 → Harga 1 → HPP/netto → HNA. Diskon hanya diterapkan jika sumber harga yang dipakai adalah HNA. Pencocokan otomatis hanya untuk keyakinan tinggi; kandidat lain tidak digabung otomatis.</p><div class="tablebox"><table class="table"><thead><tr><th>Baris</th><th>Nama produk</th><th>Satuan</th><th>Harga dipilih</th><th>Isi</th><th>Stok</th><th>Hasil pencocokan</th></tr></thead><tbody>${show||'<tr><td colspan="7">Tidak ada baris valid.</td></tr>'}</tbody></table></div>${parsed.length>12?`<p class="muted">Menampilkan 12 dari ${parsed.length} baris valid.</p>`:''}<p><b>Catatan:</b> ${skipped} baris tanpa nama dilewati; ${invalid} baris tanpa harga valid dilewati.</p><button class="btn primary" onclick="commitImport()" ${parsed.length?'':'disabled'}>Konfirmasi & Simpan ${parsed.length} baris</button> <button class="btn soft" onclick="importDraft=null;$('impResult').innerHTML=''">Batalkan Preview</button></div>`}catch(e){importDraft=null;$('impResult').innerHTML=`<div class="card"><b>Import belum dilakukan</b><p>${String(e.message||e)}</p></div>`}}
function commitImport(){if(!importDraft||!importDraft.rows.length)return alert('Preview tidak tersedia. Ulangi preview.');if(importDraft.duplicate&&!confirm('File dengan nama dan PBF ini pernah diimpor. Lanjutkan pembaruan data?'))return;let now=new Date().toISOString(),added=0,updated=0,newItems=0;for(const x of importDraft.rows){let item=x.matchId?I(x.matchId):null;if(!item){item={id:'i'+Date.now()+Math.random().toString(36).slice(2,7),name:x.name,unit:x.unit,real:0,sys:0,rop:0};d.items.push(item);newItems++}let o=d.offers.find(z=>z.item===item.id&&z.pbf===importDraft.pbf&&headerKey(z.name)===headerKey(x.name));let data={item:item.id,pbf:importDraft.pbf,name:x.name,buy:x.unit,conv:x.conv,price:x.price,stock:x.stock,sourceFile:importDraft.file,sourceSheet:importDraft.sheet,priceMode:x.priceMode,importedAt:now};if(o){Object.assign(o,data);updated++}else{d.offers.push({id:'o'+Date.now()+Math.random().toString(36).slice(2,7),...data});added++}}d.importHistory=d.importHistory||[];d.importHistory.push({file:importDraft.file,pbf:importDraft.pbf,sheet:importDraft.sheet,valid:importDraft.rows.length,skipped:importDraft.skipped,invalid:importDraft.invalid,added,updated,createdAt:now});saveDB();let result={file:importDraft.file,valid:importDraft.rows.length,added,updated,newItems};importDraft=null;$('impResult').innerHTML=`<div class="card"><h3>Impor berhasil disimpan</h3><p>File: <b>${result.file}</b></p><p>${result.valid} baris diproses · ${result.added} penawaran baru · ${result.updated} penawaran diperbarui · ${result.newItems} master baru.</p><button class="btn primary" onclick="go('offers')">Lihat Produk PBF</button></div>`}
function nav(){let h=menus.map(m=>`<button class="${page==m[0]?'on':''}" onclick="go('${m[0]}')">${m[1]}</button>`).join('');$('nav').innerHTML=h;$('mobile').innerHTML=h}function go(x){page=x;nav();render()}function render(){let m=menus.find(x=>x[0]==page);$('title').textContent=m[1];$('add').style.display=['items','pbf','offers'].includes(page)?'block':'none';page=='dash'?dash():page=='items'?items():page=='pbf'?pbf():page=='offers'?offers():page=='import'?imports():page=='stock'?stock():orders()}
function dash(){$('view').innerHTML=`<div class="card" style="background:#2563eb;color:#fff;margin-bottom:16px"><h2 style="margin:0 0 5px">Order Pintar PBF</h2><div style="color:#dbeafe">Satu data dipakai lintas modul. Firebase menyusul setelah alurnya stabil.</div></div><div class="grid"><div class="card stat"><small>Master Barang</small><strong>${d.items.length}</strong></div><div class="card stat"><small>PBF</small><strong>${d.pbf.length}</strong></div><div class="card stat"><small>Produk PBF</small><strong>${d.offers.length}</strong></div><div class="card stat"><small>Perlu Order</small><strong>${d.items.filter(x=>x.rop>x.real).length}</strong></div></div><div class="section card"><b>Data awal</b><p class="muted">Master dan penawaran bawaan adalah DATA DEMO untuk uji tampilan, bukan data PBF aktual. Hapus atau koreksi sebelum digunakan operasional.</p><b>Alur trial</b><p class="muted">Tambah Barang → Tambah PBF → Mapping Produk PBF → isi stok/ROP → lihat rekomendasi Order Pintar.</p></div>`}
function table(head,rows){$('view').innerHTML=`<div class="tablebox"><table class="table"><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${head.length}" style="text-align:center;padding:30px" class="muted">Belum ada data</td></tr>`}</tbody></table></div>`}
function items(){table(['Barang','Satuan','Stok Real','Sistem','ROP','Aksi'],d.items.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.unit}</td><td>${x.real}</td><td>${x.sys}</td><td>${x.rop}</td><td><button class="btn soft" onclick="editItem('${x.id}')">Edit</button> <button class="btn danger" onclick="delItem('${x.id}')">Hapus</button></td></tr>`).join(''))}
function pbf(){table(['PBF','Termin','Toleransi','Profil','Aksi'],d.pbf.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.term} hari</td><td>+${x.tol} hari</td><td><span class="badge ${x.profile=='Ketat'?'bad':x.profile=='Normal'?'warn':'ok'}">${x.profile}</span></td><td><button class="btn soft" onclick="editP('${x.id}')">Edit</button> <button class="btn danger" onclick="delP('${x.id}')">Hapus</button></td></tr>`).join(''))}
function offers(){table(['Barang Internal','Nama PBF','PBF','Harga','Konversi','Harga/Unit','Stok','Aksi'],d.offers.map(x=>{let i=I(x.item),p=P(x.pbf);return `<tr><td>${i?.name||'-'}</td><td><b>${x.name}</b></td><td>${p?.name||'-'}</td><td>${money(x.price)}</td><td>1 ${x.buy} = ${x.conv} ${i?.unit||'unit'}</td><td><b>${money(x.price/x.conv)}</b></td><td>${x.stock}</td><td><button class="btn soft" onclick="editO('${x.id}')">Edit</button></td></tr>`}).join(''))}
function stock(){table(['Barang','Real','Sistem','ROP','Kebutuhan','Status'],d.items.map(x=>{let n=Math.max(0,x.rop-x.real);return `<tr><td><b>${x.name}</b></td><td>${x.real}</td><td>${x.sys}</td><td>${x.rop}</td><td>${n}</td><td><span class="badge ${n?'bad':'ok'}">${n?'PERLU ORDER':'AMAN'}</span></td></tr>`}).join(''))}
function orders(){let rows='';d.items.forEach(i=>{let need=Math.max(0,i.rop-i.real),os=d.offers.filter(o=>o.item==i.id&&o.stock>0).sort((a,b)=>a.price/a.conv-b.price/b.conv),o=os[0];if(!need||!o)return;let q=Math.min(need,o.stock),packs=Math.ceil(q/o.conv);rows+=`<tr><td><b>${i.name}</b><br><small class="muted">butuh ${need} ${i.unit}</small></td><td>${P(o.pbf)?.name}<br><small>${o.name}</small></td><td>${money(o.price/o.conv)}/${i.unit}</td><td><input value="${packs}" type="number" min="0" style="width:80px;padding:8px;border:1px solid #d5dce6;border-radius:8px"></td><td>${money(packs*o.price)}</td><td><span class="badge warn">REKOMENDASI</span></td></tr>`});$('view').innerHTML=`<div class="notice">Rekomendasi dasar: harga per satuan dasar termurah yang stoknya tersedia. Qty bisa diedit; logika outstanding akan masuk tahap berikutnya.</div><div class="tablebox"><table class="table"><thead><tr><th>Barang</th><th>PBF</th><th>Harga Dasar</th><th>Qty Beli</th><th>Estimasi</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="6" style="text-align:center;padding:30px" class="muted">Belum ada kebutuhan order</td></tr>'}</tbody></table></div>`}
function modal(title,body,fn){$('mt').textContent=title;$('mb').innerHTML=body;$('save').onclick=fn;$('modal').classList.add('show')}function closeM(){$('modal').classList.remove('show');edit=null}
$('add').onclick=()=>page=='items'?editItem():page=='pbf'?editP():editO();
const formItem=x=>`<div class="form"><div class="field full"><label>Nama Barang</label><input id="n" value="${x?.name||''}"></div><div class="field"><label>Satuan Dasar</label><input id="u" value="${x?.unit||'tablet'}"></div><div class="field"><label>ROP / Target</label><input id="r" type="number" value="${x?.rop??0}"></div><div class="field"><label>Stok Real</label><input id="s" type="number" value="${x?.real??0}"></div><div class="field"><label>Stok Sistem</label><input id="sy" type="number" value="${x?.sys??0}"></div></div>`;
function editItem(id){edit=id;modal(id?'Edit Barang':'Tambah Barang',formItem(id?I(id):null),()=>{let x={name:$('n').value.trim(),unit:$('u').value.trim()||'unit',rop:+$('r').value||0,real:+$('s').value||0,sys:+$('sy').value||0};if(!x.name)return alert('Nama wajib diisi');if(id)Object.assign(I(id),x);else d.items.push({id:'i'+Date.now(),...x});saveDB();closeM();render()})}function delItem(id){if(confirm('Hapus barang?')){d.items=d.items.filter(x=>x.id!=id);d.offers=d.offers.filter(x=>x.item!=id);saveDB();render()}}
const formP=x=>`<div class="form"><div class="field full"><label>Nama PBF</label><input id="n" value="${x?.name||''}"></div><div class="field"><label>Termin Resmi (hari)</label><input id="t" type="number" value="${x?.term??30}"></div><div class="field"><label>Toleransi Operasional</label><input id="to" type="number" value="${x?.tol??0}"></div><div class="field full"><label>Profil</label><select id="pr"><option>Ketat</option><option>Normal</option><option>Longgar</option></select></div></div>`;function editP(id){edit=id;let x=id?P(id):null;modal(id?'Edit PBF':'Tambah PBF',formP(x),()=>{let z={name:$('n').value.trim(),term:+$('t').value||0,tol:+$('to').value||0,profile:$('pr').value};if(!z.name)return alert('Nama wajib diisi');if(id)Object.assign(P(id),z);else d.pbf.push({id:'p'+Date.now(),...z});saveDB();closeM();render()});setTimeout(()=>{if(x)$('pr').value=x.profile},0)}function delP(id){if(d.offers.some(x=>x.pbf==id))return alert('PBF masih dipakai di Produk PBF.');if(confirm('Hapus PBF?')){d.pbf=d.pbf.filter(x=>x.id!=id);saveDB();render()}}
function editO(id){if(!d.items.length||!d.pbf.length)return alert('Buat Master Barang dan PBF dulu.');let x=id?d.offers.find(a=>a.id==id):null;modal(id?'Edit Produk PBF':'Tambah Produk PBF',`<div class="form"><div class="field"><label>Barang Internal</label><select id="i">${d.items.map(a=>`<option value="${a.id}" ${x?.item==a.id?'selected':''}>${a.name}</option>`).join('')}</select></div><div class="field"><label>PBF</label><select id="p">${d.pbf.map(a=>`<option value="${a.id}" ${x?.pbf==a.id?'selected':''}>${a.name}</option>`).join('')}</select></div><div class="field full"><label>Nama Barang di PBF</label><input id="nm" value="${x?.name||''}"></div><div class="field"><label>Satuan Beli</label><input id="b" value="${x?.buy||'box'}"></div><div class="field"><label>Isi per Satuan</label><input id="c" type="number" value="${x?.conv??1}"></div><div class="field"><label>Harga Beli</label><input id="prc" type="number" value="${x?.price??0}"></div><div class="field"><label>Stok PBF</label><input id="st" type="number" value="${x?.stock??0}"></div></div>`,()=>{let z={item:$('i').value,pbf:$('p').value,name:$('nm').value.trim(),buy:$('b').value.trim()||'unit',conv:+$('c').value||1,price:+$('prc').value||0,stock:+$('st').value||0};if(!z.name)return alert('Nama PBF wajib diisi');if(id)Object.assign(d.offers.find(a=>a.id==id),z);else d.offers.push({id:'o'+Date.now(),...z});saveDB();closeM();render()})}
nav();render();
</script></body></html>
